<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CozyLock — Focus Lock Active</title>
  <link rel="icon" type="image/png" href="icons/icon-48.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1a1024 0%, #0a060d 100%);
      color: #fdf4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .background-orb {
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.22) 0%, rgba(255, 179, 71, 0.08) 60%, transparent 80%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
    }
    .card {
      position: relative;
      z-index: 2;
      background: rgba(26, 16, 34, 0.82);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(244, 114, 182, 0.28);
      border-radius: 28px;
      padding: 44px 36px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 35px rgba(244, 114, 182, 0.15);
    }
    .icon-container {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px auto;
      background: linear-gradient(135deg, rgba(244, 114, 182, 0.2) 0%, rgba(255, 179, 71, 0.15) 100%);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(244, 114, 182, 0.4);
      box-shadow: 0 0 24px rgba(244, 114, 182, 0.35);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #fdf4f8 0%, #fda4af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 14.5px;
      color: #b8a6c4;
      margin: 0 0 24px 0;
      line-height: 1.6;
    }
    .domain-badge {
      display: block;
      background: rgba(14, 9, 20, 0.7);
      border: 1px solid rgba(244, 114, 182, 0.22);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 24px;
    }
    .domain-label {
      font-size: 10.5px;
      color: #786684;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .domain-value {
      font-size: 15px;
      font-weight: 700;
      color: #fda4af;
      word-break: break-all;
    }
    .redirect-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(244, 114, 182, 0.12);
      border: 1px solid rgba(244, 114, 182, 0.3);
      border-radius: 9999px;
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 600;
      color: #fdf4f8;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .redirect-badge:hover {
      background: rgba(244, 114, 182, 0.25);
      box-shadow: 0 0 20px rgba(244, 114, 182, 0.4);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="background-orb"></div>
  <div class="card">
    <div class="icon-container">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1>CozyLock Focus Lock Active</h1>
    <p id="block-msg">This domain is blocked during your Cozy Corner focus session to keep you in your gentle flow.</p>
    
    <div class="domain-badge">
      <div class="domain-label">Attempted Domain</div>
      <div class="domain-value" id="blocked-domain-text">Distracting Website</div>
    </div>

    <button class="redirect-badge" id="countdown-badge">
      🌸 Return to Cozy Sanctuary (2s)...
    </button>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
